<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PicoPad Configurator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:25px 15px
}

.app{
    max-width:1050px;
    margin:auto
}

h1{
    margin:0;
    font-size:28px
}

.subtitle{
    color:#888;
    margin:4px 0 22px
}

.panel{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px
}

.profilebar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap
}

select,
input,
button{
    font:inherit
}

select,
input{
    background:#111;
    color:#eee;
    border:1px solid #444;
    border-radius:7px;
    padding:9px 11px
}

button,
.import-label{
    background:#292929;
    color:#fff;
    border:1px solid #444;
    border-radius:7px;
    padding:9px 13px;
    cursor:pointer;
    display:inline-block
}

button:hover,
.import-label:hover{
    background:#383838
}

.workspace{
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:15px;
    align-items:start
}

.pad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:480px;
    margin:20px auto
}

.key{
    min-height:115px;
    background:#242424;
    border:2px solid #444;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.12s;
    padding:10px;
    text-align:center
}

.key:hover{
    border-color:#777
}

.key.selected{
    border-color:#fff
}

.key.s4{
    border-style:dashed;
    cursor:default
}

.key-number{
    color:#777;
    font-size:12px;
    margin-bottom:6px
}

.key-label{
    font-size:16px;
    font-weight:600;
    word-break:break-word
}

.editor{
    display:grid;
    gap:13px
}

.row{
    display:flex;
    gap:10px;
    align-items:center
}

.row label{
    width:90px;
    color:#aaa;
    flex-shrink:0
}

.row input,
.row select{
    flex:1;
    min-width:0
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}

.status{
    min-height:20px;
    color:#8f8;
    font-size:14px
}

.info{
    color:#888;
    font-size:13px;
    margin-top:10px
}

.config-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap
}

input[type=file]{
    display:none
}

.empty{
    color:#777;
    text-align:center;
    padding:30px 10px
}

@media(max-width:700px){

    .workspace{
        grid-template-columns:1fr
    }

    .key{
        min-height:90px
    }

    .key-label{
        font-size:14px
    }

}
</style>
</head>

<body>

<div class="app">

<h1>🎛️ PicoPad Configurator</h1>

<div class="subtitle">
Edit PicoPad profiles and export a compatible macros.json
</div>


<!-- PROFILE -->

<div class="panel">

<div class="profilebar">

<strong>Profile</strong>

<select id="profileSelect"></select>

<button onclick="newProfile()">＋ New</button>

<button onclick="renameProfile()">Rename</button>

<button onclick="deleteProfile()">Delete</button>

</div>

<div class="info">
S4 is fixed as Profile Switch and is not editable.
</div>

</div>


<!-- PAD + EDITOR -->

<div class="workspace">


<!-- PAD -->

<div class="panel">

<h2>Buttons</h2>

<div class="pad" id="pad"></div>

</div>


<!-- EDITOR -->

<div>

<div class="panel">

<h2 id="editorTitle">
Select a button
</h2>

<div id="editor" class="editor">

<div class="row">

<label>Action</label>

<select id="actionType">

<option value="none">None</option>

<option value="keypress">
Keyboard Key
</option>

<option value="consumer">
Media Button
</option>

<option value="text">
Text
</option>

<option value="delay">
Delay
</option>

<option value="launch">
Launch
</option>

<option value="url">
URL
</option>

<option value="profile_switch">
Switch Profile
</option>

</select>

</div>


<div class="row" id="keyRow">

<label>Key</label>

<select id="keyInput">

<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
<option value="E">E</option>
<option value="F">F</option>
<option value="G">G</option>
<option value="H">H</option>
<option value="I">I</option>
<option value="J">J</option>
<option value="K">K</option>
<option value="L">L</option>
<option value="M">M</option>
<option value="N">N</option>
<option value="O">O</option>
<option value="P">P</option>
<option value="Q">Q</option>
<option value="R">R</option>
<option value="S">S</option>
<option value="T">T</option>
<option value="U">U</option>
<option value="V">V</option>
<option value="W">W</option>
<option value="X">X</option>
<option value="Y">Y</option>
<option value="Z">Z</option>

<option value="SPACE">Space</option>
<option value="ENTER">Enter</option>
<option value="ESCAPE">Escape</option>
<option value="TAB">Tab</option>

<option value="LEFT_ARROW">Left Arrow</option>
<option value="RIGHT_ARROW">Right Arrow</option>
<option value="UP_ARROW">Up Arrow</option>
<option value="DOWN_ARROW">Down Arrow</option>

<option value="BACKSPACE">Backspace</option>
<option value="DELETE">Delete</option>
<option value="HOME">Home</option>
<option value="END">End</option>
<option value="PAGE_UP">Page Up</option>
<option value="PAGE_DOWN">Page Down</option>

<option value="F3">F3</option>

<option value="F5">F5</option>
<option value="F6">F6</option>
<option value="F7">F7</option>
<option value="F8">F8</option>
<option value="F9">F9</option>
<option value="F10">F10</option>
<option value="F11">F11</option>
<option value="F12">F12</option>

</select>

</div>


<div class="row" id="consumerRow">

<label>Media</label>

<select id="consumerInput">

<option value="PLAY_PAUSE">Play / Pause</option>
<option value="SCAN_NEXT_TRACK">Next Track</option>
<option value="SCAN_PREVIOUS_TRACK">Previous Track</option>
<option value="VOLUME_INCREMENT">Volume Up</option>
<option value="VOLUME_DECREMENT">Volume Down</option>
<option value="MUTE">Mute</option>
<option value="STOP">Stop</option>

</select>

</div>


<div class="row" id="textRow">

<label>Text</label>

<input
id="textInput"
type="text"
placeholder="Text to type"
>

</div>


<div class="row" id="delayRow">

<label>Delay</label>

<input
id="delayInput"
type="number"
min="0"
placeholder="Milliseconds"
>

</div>


<div class="row" id="launchRow">

<label>Launch</label>

<input
id="launchInput"
type="text"
placeholder="Application or command"
>

</div>


<div class="row" id="urlRow">

<label>URL</label>

<input
id="urlInput"
type="text"
placeholder="https://example.com"
>

</div>


<div class="row" id="profileRow">

<label>Profile</label>

<select id="profileInput"></select>

</div>


<div class="actions">

<button onclick="saveButton()">
Save Button
</button>

<button onclick="clearButton()">
Clear Button
</button>

</div>

<div class="status" id="status"></div>

</div>

</div>


<!-- IMPORT / EXPORT -->

<div class="panel">

<h2>Configuration</h2>

<div class="config-buttons">

<label
for="fileInput"
class="import-label"
>
⬆️ Import JSON
</label>

<input
id="fileInput"
type="file"
accept=".json,application/json"
>

<button onclick="exportJSON()">
⬇️ Export JSON
</button>

</div>

<div class="info">
Your configuration is automatically saved in this browser.
</div>

</div>

</div>

</div>

</div>


<script>

/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEY = "picopad_config_v1";


/* ============================================================
   DEFAULT CONFIG
============================================================ */

const defaultConfig = {

    profiles: {

        "Default": {

            macros: []

        }

    },

    active_profile: "Default"

};


/* ============================================================
   CONFIG
============================================================ */

let config = loadLocalConfig();

let currentProfile =
    config.active_profile ||
    Object.keys(config.profiles)[0];

let selectedButton = 0;


/* ============================================================
   LOAD LOCAL STORAGE
============================================================ */

function loadLocalConfig(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                parsed &&
                parsed.profiles
            ){

                return parsed;

            }

        }

    }catch(error){

        console.error(
            "Could not load saved configuration:",
            error
        );

    }


    return structuredClone(defaultConfig);

}


/* ============================================================
   SAVE LOCAL STORAGE
============================================================ */

function saveLocal(){

    try{

        config.active_profile =
            currentProfile;

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(config)
        );

    }catch(error){

        console.error(
            "Could not save configuration:",
            error
        );

    }

}


/* ============================================================
   PROFILE
============================================================ */

function getProfile(){

    return config.profiles[currentProfile];

}


/* ============================================================
   FIND MACRO
============================================================ */

function findMacro(row,col){

    const profile =
        getProfile();

    if(!profile){

        return null;

    }


    return (
        profile.macros || []
    ).find(
        macro =>
            Number(macro.row) === row &&
            Number(macro.col) === col
    ) || null;

}


/* ============================================================
   FIND MACRO INDEX
============================================================ */

function findMacroIndex(row,col){

    const profile =
        getProfile();

    if(!profile){

        return -1;

    }


    return (
        profile.macros || []
    ).findIndex(
        macro =>
            Number(macro.row) === row &&
            Number(macro.col) === col
    );

}


/* ============================================================
   PROFILE LIST
============================================================ */

function refreshProfiles(){

    const select =
        document.getElementById(
            "profileSelect"
        );


    select.innerHTML = "";


    Object.keys(
        config.profiles
    ).forEach(name => {

        const option =
            document.createElement(
                "option"
            );


        option.value = name;

        option.textContent = name;


        if(name === currentProfile){

            option.selected = true;

        }


        select.appendChild(option);

    });


    populateProfileActions();

    drawPad();

    loadButton();

}


/* ============================================================
   PROFILE SELECT
============================================================ */

document
.getElementById("profileSelect")
.addEventListener(
    "change",
    function(){

        currentProfile =
            this.value;

        config.active_profile =
            currentProfile;

        selectedButton = 0;

        saveLocal();

        refreshProfiles();

    }
);


/* ============================================================
   PROFILE ACTION DROPDOWN
============================================================ */

function populateProfileActions(){

    const select =
        document.getElementById(
            "profileInput"
        );


    select.innerHTML = "";


    Object.keys(
        config.profiles
    ).forEach(name => {

        const option =
            document.createElement(
                "option"
            );

        option.value = name;

        option.textContent = name;

        select.appendChild(option);

    });

}


/* ============================================================
   DRAW PAD
============================================================ */

function drawPad(){

    const pad =
        document.getElementById(
            "pad"
        );


    pad.innerHTML = "";


    for(let i=0;i<9;i++){

        const row =
            Math.floor(i / 3);

        const col =
            i % 3;


        const macro =
            findMacro(row,col);


        const key =
            document.createElement(
                "div"
            );


        key.className = "key";


        if(i === selectedButton){

            key.classList.add(
                "selected"
            );

        }


        let label =
            getMacroLabel(macro);


        key.innerHTML = `

            <div class="key-number">
                ${i + 1}
            </div>

            <div class="key-label">
                ${escapeHTML(label)}
            </div>

        `;


        key.onclick = function(){

            selectedButton = i;

            drawPad();

            loadButton();

        };


        pad.appendChild(key);

    }


    /* Fixed S4 */

    const s4 =
        document.createElement(
            "div"
        );


    s4.className =
        "key s4";


    s4.innerHTML = `

        <div class="key-number">
            S4
        </div>

        <div class="key-label">
            Profile Switch
        </div>

    `;


    pad.appendChild(s4);

}


/* ============================================================
   MACRO LABEL
============================================================ */

function getMacroLabel(macro){

    if(!macro){

        return "Empty";

    }


    const actions =
        macro.actions || [];


    if(actions.length === 0){

        return "Empty";

    }


    if(actions.length > 1){

        return `${actions.length} actions`;

    }


    const action =
        actions[0];


    switch(action.type){

        case "keypress":
            return action.value || "Key";

        case "consumer":
            return mediaLabel(
                action.value
            );

        case "text":
            return action.value
                ? `"${action.value}"`
                : "Text";

        case "delay":
            return `${action.value} ms`;

        case "launch":
            return action.value || "Launch";

        case "url":
            return action.value || "URL";

        case "profile_switch":
            return action.value
                ? `→ ${action.value}`
                : "Profile";

        default:
            return action.type || "Action";

    }

}


/* ============================================================
   MEDIA LABEL
============================================================ */

function mediaLabel(value){

    const labels = {

        PLAY_PAUSE:"Play/Pause",

        SCAN_NEXT_TRACK:"Next",

        SCAN_PREVIOUS_TRACK:"Previous",

        VOLUME_INCREMENT:"Volume +",

        VOLUME_DECREMENT:"Volume -",

        MUTE:"Mute",

        STOP:"Stop"

    };


    return labels[value] || value || "Media";

}


/* ============================================================
   LOAD BUTTON
============================================================ */

function loadButton(){

    const title =
        document.getElementById(
            "editorTitle"
        );


    const macro =
        findMacro(
            Math.floor(
                selectedButton / 3
            ),
            selectedButton % 3
        );


    title.textContent =
        `Button ${selectedButton + 1}`;


    clearEditor();


    if(!macro){

        updateFields();

        return;

    }


    const actions =
        macro.actions || [];


    if(actions.length === 0){

        updateFields();

        return;

    }


    const action =
        actions[0];


    document.getElementById(
        "actionType"
    ).value =
        action.type || "none";


    const value =
        action.value ?? "";


    switch(action.type){

        case "keypress":

            document.getElementById(
                "keyInput"
            ).value = value;

            break;


        case "consumer":

            document.getElementById(
                "consumerInput"
            ).value = value;

            break;


        case "text":

            document.getElementById(
                "textInput"
            ).value = value;

            break;


        case "delay":

            document.getElementById(
                "delayInput"
            ).value = value;

            break;


        case "launch":

            document.getElementById(
                "launchInput"
            ).value = value;

            break;


        case "url":

            document.getElementById(
                "urlInput"
            ).value = value;

            break;


        case "profile_switch":

            document.getElementById(
                "profileInput"
            ).value = value;

            break;

    }


    updateFields();

}


/* ============================================================
   CLEAR EDITOR
============================================================ */

function clearEditor(){

    document.getElementById(
        "actionType"
    ).value = "none";


    document.getElementById(
        "keyInput"
    ).selectedIndex = 0;


    document.getElementById(
        "consumerInput"
    ).selectedIndex = 0;


    document.getElementById(
        "textInput"
    ).value = "";


    document.getElementById(
        "delayInput"
    ).value = "";


    document.getElementById(
        "launchInput"
    ).value = "";


    document.getElementById(
        "urlInput"
    ).value = "";


    if(
        document.getElementById(
            "profileInput"
        ).options.length
    ){

        document.getElementById(
            "profileInput"
        ).selectedIndex = 0;

    }

}


/* ============================================================
   ACTION FIELDS
============================================================ */

document
.getElementById("actionType")
.addEventListener(
    "change",
    updateFields
);


function updateFields(){

    const type =
        document.getElementById(
            "actionType"
        ).value;


    document.getElementById(
        "keyRow"
    ).style.display =
        type === "keypress"
        ? "flex"
        : "none";


    document.getElementById(
        "consumerRow"
    ).style.display =
        type === "consumer"
        ? "flex"
        : "none";


    document.getElementById(
        "textRow"
    ).style.display =
        type === "text"
        ? "flex"
        : "none";


    document.getElementById(
        "delayRow"
    ).style.display =
        type === "delay"
        ? "flex"
        : "none";


    document.getElementById(
        "launchRow"
    ).style.display =
        type === "launch"
        ? "flex"
        : "none";


    document.getElementById(
        "urlRow"
    ).style.display =
        type === "url"
        ? "flex"
        : "none";


    document.getElementById(
        "profileRow"
    ).style.display =
        type === "profile_switch"
        ? "flex"
        : "none";

}


/* ============================================================
   SAVE BUTTON
============================================================ */

function saveButton(){

    const profile =
        getProfile();


    if(!profile){

        return;

    }


    if(!profile.macros){

        profile.macros = [];

    }


    const row =
        Math.floor(
            selectedButton / 3
        );


    const col =
        selectedButton % 3;


    const type =
        document.getElementById(
            "actionType"
        ).value;


    const index =
        findMacroIndex(row,col);


    /* NONE = remove macro */

    if(type === "none"){

        if(index !== -1){

            profile.macros.splice(
                index,
                1
            );

        }


        saveLocal();

        drawPad();

        setStatus(
            "Button cleared."
        );

        return;

    }


    let value = "";


    switch(type){

        case "keypress":

            value =
                document.getElementById(
                    "keyInput"
                ).value;

            break;


        case "consumer":

            value =
                document.getElementById(
                    "consumerInput"
                ).value;

            break;


        case "text":

            value =
                document.getElementById(
                    "textInput"
                ).value;

            break;


        case "delay":

            value =
                document.getElementById(
                    "delayInput"
                ).value;

            break;


        case "launch":

            value =
                document.getElementById(
                    "launchInput"
                ).value;

            break;


        case "url":

            value =
                document.getElementById(
                    "urlInput"
                ).value;

            break;


        case "profile_switch":

            value =
                document.getElementById(
                    "profileInput"
                ).value;

            break;

    }


    const newMacro = {

        row: row,

        col: col,

        actions: [

            {

                type: type,

                value: value

            }

        ]

    };


    if(index === -1){

        profile.macros.push(
            newMacro
        );

    }else{

        profile.macros[index] =
            newMacro;

    }


    saveLocal();

    drawPad();

    loadButton();

    setStatus(
        "Button saved."
    );

}


/* ============================================================
   CLEAR BUTTON
============================================================ */

function clearButton(){

    const profile =
        getProfile();


    const row =
        Math.floor(
            selectedButton / 3
        );


    const col =
        selectedButton % 3;


    const index =
        findMacroIndex(row,col);


    if(index !== -1){

        profile.macros.splice(
            index,
            1
        );

    }


    saveLocal();

    drawPad();

    loadButton();

    setStatus(
        "Button cleared."
    );

}


/* ============================================================
   NEW PROFILE
============================================================ */

function newProfile(){

    const name =
        prompt(
            "Profile name:"
        );


    if(!name){

        return;

    }


    if(config.profiles[name]){

        alert(
            "That profile already exists."
        );

        return;

    }


    config.profiles[name] = {

        macros: []

    };


    currentProfile = name;

    config.active_profile =
        name;

    selectedButton = 0;


    saveLocal();

    refreshProfiles();

}


/* ============================================================
   RENAME PROFILE
============================================================ */

function renameProfile(){

    const name =
        prompt(
            "New profile name:",
            currentProfile
        );


    if(
        !name ||
        name === currentProfile
    ){

        return;

    }


    if(config.profiles[name]){

        alert(
            "That profile already exists."
        );

        return;

    }


    config.profiles[name] =
        config.profiles[
            currentProfile
        ];


    delete config.profiles[
        currentProfile
    ];


    currentProfile = name;

    config.active_profile = name;


    saveLocal();

    refreshProfiles();

}


/* ============================================================
   DELETE PROFILE
============================================================ */

function deleteProfile(){

    const names =
        Object.keys(
            config.profiles
        );


    if(names.length <= 1){

        alert(
            "You need at least one profile."
        );

        return;

    }


    if(
        !confirm(
            `Delete "${currentProfile}"?`
        )
    ){

        return;

    }


    delete config.profiles[
        currentProfile
    ];


    currentProfile =
        Object.keys(
            config.profiles
        )[0];


    config.active_profile =
        currentProfile;


    selectedButton = 0;


    saveLocal();

    refreshProfiles();

}


/* ============================================================
   IMPORT JSON
============================================================ */

document
.getElementById("fileInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                try{

                    const imported =
                        JSON.parse(
                            e.target.result
                        );


                    if(
                        !imported ||
                        !imported.profiles
                    ){

                        throw new Error(
                            "This is not a valid PicoPad macros.json."
                        );

                    }


                    /* Keep the REAL PicoPad structure */

                    config = imported;


                    currentProfile =
                        config.active_profile ||
                        Object.keys(
                            config.profiles
                        )[0];


                    if(
                        !config.profiles[
                            currentProfile
                        ]
                    ){

                        currentProfile =
                            Object.keys(
                                config.profiles
                            )[0];

                        config.active_profile =
                            currentProfile;

                    }


                    selectedButton = 0;


                    saveLocal();

                    refreshProfiles();


                    setStatus(
                        "PicoPad JSON imported and saved."
                    );

                }


                catch(error){

                    alert(
                        "Could not import JSON.\n\n" +
                        error.message
                    );

                }

            };


        reader.readAsText(file);

        event.target.value = "";

    }
);


/* ============================================================
   EXPORT JSON
============================================================ */

function exportJSON(){

    config.active_profile =
        currentProfile;


    saveLocal();


    const json =
        JSON.stringify(
            config,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "macros.json";


    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(url);


    setStatus(
        "macros.json exported."
    );

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(message){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    clearTimeout(
        window.statusTimer
    );


    window.statusTimer =
        setTimeout(
            () => {
                status.textContent = "";
            },
            2500
        );

}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
